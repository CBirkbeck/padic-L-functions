name = "padic-L-functions"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PadicLFunctions"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "master"

# Level-raising operator (ι_d : M_k(Γ₁(M)) → M_k(Γ₁(dM))) for the §8
# Γ₀(p)-modularity of the p-stabilised Eisenstein series — from the
# strong-multiplicity-one project. Pinned to compat/padic-mathlib-431
# (= hecke-ring @ 720d950 + four mechanical mathlib-skew fixes + tidy).
[[require]]
name = "LeanModularForms"
git = "https://github.com/CBirkbeck/LeanModularForms.git"
rev = "512911ce1a936ac9054415c5c72701fbd5cd5ae5"

[[require]]
name = "VersoBlueprint"
git = "https://github.com/leanprover/verso-blueprint"
rev = "v4.30.0"

# mathlib LAST so its transitive pins (batteries, aesop, proofwidgets, …)
# take precedence over the other requires' older manifests on `lake update`.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "master"

# The mathlib linter options live on the main library only: the blueprint
# library's import closure (Verso) does not define them.
[[lean_lib]]
name = "PadicLFunctions"
globs = ["PadicLFunctions"]

[lean_lib.leanOptions]
linter.mathlibStandardSet = true
linter.flexible = true
linter.style.header = false

[[lean_lib]]
name = "PadicLFunctionsBlueprint"
globs = ["PadicLFunctionsBlueprint"]
